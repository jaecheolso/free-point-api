spring:
  application:
    name: free-point-api

  datasource:
    # MODE=MySQL          : 운영 가정 환경(Aurora MySQL)과 DDL/함수 의미를 맞춘다.
    # DATABASE_TO_LOWER   : 식별자를 소문자로 고정해 MySQL 및 Hibernate 명명전략과 일치시킨다.
    # DB_CLOSE_DELAY=-1   : 커넥션이 모두 닫혀도 JVM 생존 동안 인메모리 DB를 유지한다.
    # LOCK_TIMEOUT=10000  : H2 기본 락 대기는 짧아서, 동시성 테스트에서 같은
    #                       point_account 행을 다투면 대기 만료로 실패한다.
    url: jdbc:h2:mem:point;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      pool-name: point-pool
      maximum-pool-size: 20
      # 취소 요청은 계정 락 전에 pointKey 로 userId 를 조회한다. MySQL 기본값(REPEATABLE READ)에서는
      # 이 첫 조회 시점에 스냅샷이 고정돼 락 획득 후에도 앞선 커밋을 보지 못하므로 READ COMMITTED 로 고정한다.
      # (H2 는 기본값이 READ COMMITTED 라 동작 차이가 없다.)
      transaction-isolation: TRANSACTION_READ_COMMITTED

  sql:
    init:
      # schema.sql 을 스키마의 단일 출처로 둔다. (ddl-auto: validate 와 짝)
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  jpa:
    hibernate:
      # 기동 시 엔티티 매핑이 schema.sql 로 만든 테이블과 일치하는지 검증한다.
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50

  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.freepoint: DEBUG
